# pi-holdpty CI — pi-package convention
#
# Trigger: push to main, pull_request.
# Jobs:
#   verify    — typecheck + test:coverage + smoke-test (Ubuntu + macOS matrix)
#   package-dry-run — npm pack
#   publish   — npm publish on main if version bumped
#
# Required secret: NPM_TOKEN (npm automation token).
# Add via: gh secret set NPM_TOKEN --repo buihongduc132/pi-holdpty

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test:coverage
      - name: Smoke test
        run: npm run smoke-test
        timeout-minutes: 3
        env:
          HOLDPTY_LINGER_MS: '200'
      - name: Kill orphan holders
        if: always()
        shell: bash
        run: pkill -f "__holder" || true

  package-dry-run:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run

  publish:
    needs: package-dry-run
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Check version bump
        run: |
          CURRENT=$(npm view pi-holdpty version 2>/dev/null || echo "0.0.0")
          LOCAL=$(node -p "require('./package.json').version")
          if [ "$CURRENT" = "$LOCAL" ]; then
            echo "Version $LOCAL already published — skipping."
            exit 1
          fi
          echo "Publishing $LOCAL (current on npm: $CURRENT)"
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
